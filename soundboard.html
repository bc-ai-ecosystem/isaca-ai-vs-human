<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AV soundboard | AI vs. Human</title><style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#090c12;color:#edf2f6}*{box-sizing:border-box}body{margin:0}main{max-width:1150px;margin:auto;padding:30px 24px 60px}a{color:#99d7ff}h1{font-size:clamp(38px,6vw,82px);margin-bottom:12px}p{color:#b8c5d4;line-height:1.6}.desk{display:flex;gap:22px;align-items:center;flex-wrap:wrap;background:#152235;padding:22px;border:1px solid #52677f}.desk label{display:flex;gap:12px;align-items:center}button{font:inherit;cursor:pointer;min-height:48px;border-radius:5px;border:1px solid #688098;background:#21364e;color:#f0f5f9;padding:12px 22px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ffcf6b;outline-offset:4px}#stop{background:#652b36;border-color:#ff8490}.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:26px}.pad{background:#101d2c;border:1px solid #364b63;padding:22px;min-height:235px}.pad.active{border-color:#8fd9ff;box-shadow:inset 0 4px #8fd9ff}.pad h2{font-size:24px}.pad .row{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px}.num{font-size:30px;color:#87c6ff}.pulse{display:flex;align-items:center;gap:5px;height:28px;margin-left:auto}.pulse i{display:block;width:5px;height:8px;background:#86d7ff}body.playing .pulse i{animation:beat .65s ease-in-out infinite alternate}body.playing .pulse i:nth-child(2){animation-delay:.2s}body.playing .pulse i:nth-child(3){animation-delay:.4s}body.playing .pulse i:nth-child(4){animation-delay:.1s}@keyframes beat{to{height:26px}}@media(prefers-reduced-motion:reduce){.pulse i{animation:none!important}}@media(max-width:800px){.pads{grid-template-columns:1fr 1fr}}@media(max-width:520px){main{padding:22px 14px}.pads{grid-template-columns:1fr}}
</style></head><body><main><a href="review.html">← Film review and show media</a><p>ISACA Vancouver × BC + AI / Manual AV cues</p><h1>Set the tension.</h1><p>Original beds and stings for the AV operator. Start cues deliberately and stop the bed before scenario-film playback. The game screens stay silent. Keyboard: 1–5 plays a cue; Escape stops.</p><div class="desk"><button id="stop" type="button">Stop audio</button><label>Level <input id="volume" aria-label="Audio level" type="range" min="0" max="1" step=".01" value=".6"></label><label><input id="loop" type="checkbox">Loop thinking/tension beds</label><div class="pulse" aria-hidden="true"><i></i><i></i><i></i><i></i></div><p id="status" role="status">Loading cue bank…</p></div><div id="pads" class="pads"></div><noscript><p>The <a href="media/av-soundbank.json">cue catalogue</a> lists the complete WAV/MP3 downloads for an offline AV player.</p></noscript></main><script>
const player=new Audio(),status=document.querySelector("#status");let cues=[],selected=null;
function stop(){player.pause();player.currentTime=0;selected=null;document.body.classList.remove("playing");document.querySelectorAll(".pad").forEach(p=>p.classList.remove("active"));status.textContent="Audio stopped.";}
function play(cue){player.pause();selected=cue;player.src="media/"+cue.assets.mp3.file;player.volume=Number(document.querySelector("#volume").value);player.loop=cue.loop_available&&document.querySelector("#loop").checked;player.play().then(()=>{if(selected!==cue)return;status.textContent=cue.title+" playing"+(player.loop?" / loop":"");document.body.classList.add("playing");document.querySelectorAll(".pad").forEach(p=>p.classList.toggle("active",p.dataset.cue===cue.id));}).catch(error=>{if(selected!==cue||error.name==="AbortError")return;status.textContent="Playback failed. Use the WAV/MP3 download in an external player.";});}
document.querySelector("#stop").onclick=stop;document.querySelector("#volume").oninput=e=>player.volume=Number(e.target.value);document.querySelector("#loop").onchange=e=>{player.loop=!!selected?.loop_available&&e.target.checked;};player.onended=stop;player.onerror=()=>{status.textContent="Cue unavailable. Use the downloadable audio file.";document.body.classList.remove("playing");};
fetch("media/av-soundbank.json").then(r=>{if(!r.ok)throw Error("Cue bank unavailable");return r.json();}).then(bank=>{cues=bank.cues;cues.forEach((cue,i)=>{const pad=document.createElement("section"),num=document.createElement("span"),h=document.createElement("h2"),p=document.createElement("p"),button=document.createElement("button"),row=document.createElement("div");pad.className="pad";pad.dataset.cue=cue.id;num.className="num";num.textContent=String(i+1).padStart(2,"0");h.textContent=cue.title;p.textContent=`${cue.duration_seconds.toFixed(1)} seconds / ${cue.loop_available?"bed, optional manual loop":"one shot"}`;button.type="button";button.textContent="Play cue";button.onclick=()=>play(cue);row.className="row";for(const kind of["wav","mp3"]){const a=document.createElement("a");a.href="media/"+cue.assets[kind].file;a.download="";a.textContent="Download "+kind.toUpperCase();row.appendChild(a);}pad.append(num,h,p,button,row);document.querySelector("#pads").appendChild(pad);});status.textContent="Ready. Five original cues.";}).catch(e=>status.textContent=e.message+" Use the cue catalogue downloads.");
addEventListener("keydown",e=>{if(e.key==="Escape"){stop();return;}if(e.target.closest("input,button,a"))return;if(/^[1-5]$/.test(e.key)&&cues[Number(e.key)-1]){e.preventDefault();play(cues[Number(e.key)-1]);}});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
