<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AI vs. Human Showrunner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111C2C'/%3E%3Cpath d='M4 24 9 8h3l5 16h-3.2l-1-3.6H7.2L6.2 24zm4-6.2h4L10 11z' fill='%238CD8FF'/%3E%3Cpath d='M19 8h3v6h4V8h3v16h-3v-7h-4v7h-3z' fill='%23FF6571'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Smoked glass and team light; opaque inset displays keep projected digits legible. */
:root{
  color-scheme:dark;
  --void:#070C14;
  --ink:#111C2C;
  --panel:#1B2D42;
  --raised:#29405A;
  --line:#62798B;
  --text:#F3ECD8;
  --muted:#BBC7CF;
  --ember:#FFB85C;
  --ember-soft:rgba(255,184,92,.12);
  --ice:#8CD8FF;
  --ice-soft:rgba(140,216,255,.12);
  --bad:#FF8270;
  --warn:#FFCA71;
  --ok:#B8D990;
  --ka:#E21B3C;--kb:#1368CE;--kc:#D89E00;--kd:#26890C;
  --lamp:#FFC66D;--lamp-off:#392A18;--glass:#0A1320;--cream:#F3ECD8;
  --disp:"Big Shoulders Display","Impact","Arial Narrow Bold","Arial Narrow",sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--void);color:var(--text);font-family:var(--sans);overflow:hidden}
#app{position:relative;height:100%;display:flex}
#vp{position:relative;flex:1;min-width:0;overflow:hidden;background:var(--void)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--ink);overflow:hidden;font-size:30px;line-height:1.35}

.provider-badge{display:flex;align-items:center;gap:18px;margin-bottom:20px;font-weight:700;font-size:32px}
.provider-badge img{padding:8px;background:#F3ECD8;border-radius:10px;object-fit:contain}

/* ---------- theatre frame and illuminated score bays ---------- */
.bg{position:absolute;inset:20px;pointer-events:none;border:1px solid #bcc9d538;border-radius:18px;
  background:radial-gradient(ellipse at 0 25%,#ffb85c20,transparent 55%),radial-gradient(ellipse at 100% 55%,#8cd8ff23,transparent 55%),linear-gradient(135deg,#ffffff08,transparent 40%);
  box-shadow:inset 0 1px 0 #ffffff1a,inset 0 -1px 0 #ffffff0a,0 0 0 20px var(--void)}
.scan{display:none}
#bug{position:absolute;left:70px;right:70px;top:40px;height:142px;display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:26px;align-items:stretch;border-bottom:2px solid var(--line);padding-bottom:18px;text-transform:uppercase}
#bug[hidden]{display:none}
.bug-h,.bug-a{display:flex;align-items:center;justify-content:space-between;gap:22px;padding:12px 24px;background:var(--glass);border:1px solid var(--line);border-radius:4px;box-shadow:inset 0 4px 12px #0008}
.bug-h b,.bug-a b{font-family:var(--disp);font-size:48px;line-height:1;letter-spacing:.025em;color:var(--cream)}
.bug-h{border-top:4px solid var(--ember)}.bug-a{border-top:4px solid var(--ice)}
.bug-n{display:block;height:100px;color:var(--lamp);line-height:1}
.bug-mid{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 24px;text-align:center}
.bug-round{display:grid;justify-items:center;gap:5px}
.bug-round .lbl{font-size:17px;letter-spacing:.2em}
.bug-round .round-lamps{height:48px}
.bug-clock{display:grid;gap:4px;justify-items:center}
.bug-clock .lbl{font-size:17px;letter-spacing:.16em}
.bug-clock .clock-lamps{height:58px}
.bug-detail{grid-column:1/-1;display:flex;justify-content:center;gap:16px;font:18px/1 var(--mono);color:var(--text);white-space:nowrap}
.bug-detail .demo{color:var(--warn);font-size:15px}
.lamp-display{position:relative;display:inline-flex;height:100%;color:var(--lamp);vertical-align:middle;filter:drop-shadow(0 0 4px #ffc66d22)}
.lamp-display svg{height:100%;width:auto;max-width:100%;overflow:visible}
.lamp-display .bulb{fill:var(--lamp-off)}
.lamp-display .bulb.on{fill:currentColor}
.lamp-text{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip-path:inset(50%)!important;white-space:nowrap!important}

/* ---------- scene frame ---------- */
#scene{position:absolute;inset:226px 90px 64px}
#scene.bare{inset:70px 90px}
.tag{font-family:var(--mono);font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tag b{color:var(--text);font-weight:600}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.ember{color:var(--ember)} .ice{color:var(--ice)}
.lbl{font-family:var(--mono);font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.shead{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;margin-bottom:34px}
.shead h2{font-family:var(--disp);font-weight:800;font-size:84px;line-height:.95;text-transform:uppercase;letter-spacing:.01em;margin-top:8px}

/* One entrance per cue keeps live data refreshes and keyboard input immediate. */
.enter{animation:rise .26s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes award{50%{color:var(--cream)}}
.score-earned .lamp-display{animation:award .26s ease-out}
.bug-x .lamp-display{height:20px;margin-left:6px}
.bug-clock.closed .lbl{color:var(--lamp)}

/* ---------- pre-show ---------- */
.preshow{height:100%;display:grid;grid-template-rows:auto 1fr auto;justify-items:center;text-align:center;gap:28px}
.ps-seat{align-self:center;font-family:var(--disp);font-weight:800;font-size:170px;line-height:.92;text-transform:uppercase;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}
.ps-join{font-size:40px;padding:22px 44px;border:2px solid var(--line);border-radius:14px;background:rgba(13,19,38,.8)}
.ps-join b{color:var(--ice);font-weight:600}
.ps-join .pin{font-family:var(--mono);color:var(--text);letter-spacing:.12em}
.ps-foot{font-family:var(--mono);font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* ---------- title slam ---------- */
.title{height:100%;display:grid;align-content:center;justify-items:center;text-align:center;gap:26px}
.slam{font-family:var(--disp);font-weight:900;font-size:300px;line-height:.82;text-transform:uppercase;display:flex;align-items:center;gap:40px}
.slam .vs{font-family:var(--sans);font-style:italic;font-weight:500;font-size:90px;color:var(--muted);text-transform:none}
.title .sub{font-size:50px;font-weight:500}
.title .credits{font-family:var(--mono);font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---------- rules ---------- */
.rules{position:relative;height:100%;display:grid;align-content:center}
.rules h2{font-family:var(--disp);font-weight:800;font-size:96px;text-transform:uppercase;line-height:1;margin:10px 0 40px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:22px}
.steps li{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 26px;display:grid;align-content:start;gap:14px;font-size:27px;line-height:1.35}
.steps .no{font-family:var(--disp);font-weight:900;font-size:72px;line-height:1;color:var(--muted)}
.steps li:nth-child(2) .no{color:var(--ember)} .steps li:nth-child(3) .no{color:var(--ice)}
.jrow-mini{display:flex;gap:18px;margin-top:40px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:24px;letter-spacing:.06em;padding:10px 18px;border:1px solid var(--line);border-radius:999px;color:var(--text);background:var(--panel)}

/* ---------- round title ---------- */
.round{height:100%;display:grid;align-content:center;gap:30px}
.rnum{font-family:var(--mono);font-size:30px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.rnum b{color:var(--text)}
.rnum.combo{color:var(--text)}
.rnum.combo span{background:linear-gradient(90deg,var(--ember),#fff,var(--ice));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600}
.rtitle{font-family:var(--disp);font-weight:900;font-size:210px;line-height:.86;text-transform:uppercase;max-width:1600px}
.rtitle.long{font-size:170px}
.chips{display:flex;gap:14px;flex-wrap:wrap}
.tension{font-size:40px;font-weight:500;display:flex;gap:22px;align-items:baseline}
.tension .lbl{font-size:22px}

/* ---------- briefing ---------- */
.bgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:56px;align-items:start}
.story{display:grid;align-content:start;gap:22px;font-size:30px;line-height:1.42;max-width:62ch}
.story p.quote{font-style:italic;color:#fff;border-left:4px solid var(--ember);padding-left:24px}
.board{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px 32px;display:grid;align-content:start;gap:4px}
.board .lbl{margin-bottom:12px}
.fact{display:grid;grid-template-columns:1fr auto;gap:22px;align-items:center;padding:13px 0;border-top:1px solid rgba(38,49,90,.7);font-size:28px}
.board .lbl+.fact{border-top:0}
.pill{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:8px 16px;border-radius:8px;white-space:nowrap}
.pill.bad{background:rgba(255,77,97,.16);color:var(--bad);box-shadow:inset 0 0 0 1px rgba(255,77,97,.5)}
.pill.warn{background:rgba(255,181,71,.14);color:var(--warn);box-shadow:inset 0 0 0 1px rgba(255,181,71,.45)}
.pill.ok{background:rgba(61,220,151,.12);color:var(--ok);box-shadow:inset 0 0 0 1px rgba(61,220,151,.4)}
.pill.info{background:rgba(140,151,190,.12);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.clock{margin-top:22px;display:flex;justify-content:space-between;align-items:center;padding:20px 26px;border-radius:14px;background:rgba(255,77,97,.1);box-shadow:inset 0 0 0 2px rgba(255,77,97,.55)}
.clock .t{font-family:var(--mono);font-size:84px;font-weight:600;color:var(--bad);font-variant-numeric:tabular-nums;line-height:1}

/* ---------- poll ---------- */
.poll .shead{margin-bottom:26px}
.poll .shead h2{font-size:72px;max-width:1300px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.opt{position:relative;display:grid;grid-template-columns:84px 1fr;gap:24px;align-items:start;border-radius:16px;padding:24px 28px 26px 24px;color:#fff}
.opt.ka{background:var(--ka)}.opt.kb{background:var(--kb)}.opt.kc{background:var(--kc);color:#1A1200}.opt.kd{background:var(--kd)}
.opt.kc .shape,.sw.kc .shape{fill:#1A1200}
.opt .shape{width:84px;height:84px;fill:#fff}
.oh{font-size:40px;font-weight:700;line-height:1.15;margin-bottom:10px}
.oh b{font-family:var(--disp);font-size:54px;font-weight:900;margin-right:12px}
.od{font-size:29px;line-height:1.34}
.aibadge{position:absolute;top:-16px;right:22px;font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:.1em;background:var(--ink);color:var(--ice);padding:8px 14px;border-radius:8px;box-shadow:0 0 0 2px var(--ice)}
.timer{display:flex;align-items:center;gap:22px;flex-shrink:0}
.ring{--p:1;width:132px;height:132px;border-radius:50%;background:conic-gradient(var(--ember) calc(var(--p)*1turn),rgba(255,255,255,.08) 0);display:grid;place-items:center}
.ring span{width:106px;height:106px;border-radius:50%;background:var(--ink);display:grid;place-items:center;font-family:var(--mono);font-size:50px;font-weight:600;font-variant-numeric:tabular-nums}
.timer .tl{font-family:var(--mono);font-size:24px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.45}
.timer .tl [data-tl]{color:var(--text);font-weight:600}
.timer.done .ring{background:rgba(255,77,97,.5)}
.timer.done .tl [data-tl]{color:var(--bad)}
.p2note{font-size:28px;margin:-8px 0 20px;color:var(--text)}
.p2note b{color:var(--ice)}

/* ---------- human result ---------- */
.hgrid{display:grid;grid-template-columns:1.35fr 1fr;gap:60px;align-items:center;margin-top:30px}
.bars{display:grid;gap:26px}
.bar{display:grid;grid-template-columns:78px 1fr 150px;gap:24px;align-items:center}
.bar .sw{width:78px;height:78px;border-radius:12px;display:grid;place-items:center}
.bar .sw .shape{width:44px;height:44px;fill:#fff}
.bar .bl{font-size:27px;margin-bottom:10px;display:flex;gap:12px;align-items:baseline}
.bar .bl b{font-family:var(--disp);font-size:36px;font-weight:900}
.track{height:30px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden}
.fill{height:100%;border-radius:8px;transform-origin:left}
.bar .pc{font-family:var(--mono);font-size:44px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.bar .pc small{display:block;font-size:22px;color:var(--muted);font-weight:400}
.bar.win .bl{color:#fff}
.bar.lose{opacity:.55}
.verdict{border-radius:22px;padding:40px 44px;display:grid;gap:14px;justify-items:start}
.verdict.h{background:var(--ember-soft);box-shadow:inset 0 0 0 2px var(--ember)}
.verdict.x{background:linear-gradient(135deg,var(--ember-soft),var(--ice-soft));box-shadow:inset 0 0 0 2px #fff}
.verdict .big{font-family:var(--disp);font-weight:900;font-size:300px;line-height:.8}
.verdict.h .big{color:var(--ember)}
.verdict.x .big{background:linear-gradient(90deg,var(--ember),#fff,var(--ice));-webkit-background-clip:text;background-clip:text;color:transparent}
.verdict .vt{font-size:40px;font-weight:600;line-height:1.2}
.verdict.wait{background:var(--panel);box-shadow:inset 0 0 0 2px var(--line)}
.verdict.wait .vt{color:var(--muted);font-weight:500}
.delta{font-family:var(--mono);font-size:24px;color:var(--muted)}

/* ---------- AI decision ---------- */
.agrid{display:grid;grid-template-columns:.8fr 1.4fr;gap:50px;align-items:start}
.feed{font-family:var(--mono);font-size:24px;line-height:1.55;color:var(--ice);background:rgba(7,11,24,.8);border:1px solid rgba(88,225,242,.3);border-radius:16px;padding:26px 28px;display:grid;align-content:start;gap:6px;overflow:hidden}
.feed div{white-space:normal}
.feed .dim{color:var(--muted)}
.acard{background:var(--panel);border-radius:22px;box-shadow:inset 0 0 0 2px var(--ice);padding:32px 40px;display:grid;align-content:start;gap:24px}
.adec{display:grid;grid-template-columns:auto 1fr auto;gap:34px;align-items:center}
.adec .big{font-family:var(--disp);font-weight:900;font-size:150px;line-height:.8;color:var(--ice)}
.adec .as{font-size:36px;font-weight:600;line-height:1.15;margin-top:8px}
.conf{display:grid;justify-items:end;gap:10px;min-width:260px}
.conf .cv{font-family:var(--mono);font-size:64px;font-weight:600;color:var(--ice);line-height:1}
.meter{width:260px;height:14px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ice);transform-origin:left}
.ablock{display:grid;gap:8px;font-size:31px;line-height:1.4}
.ablock.risk p{color:#FFD9C4}

/* ---------- judges ---------- */
.faceoff{display:flex;justify-content:center;align-items:stretch;gap:36px;margin-bottom:26px}
.side{flex:1;max-width:640px;border-radius:20px;padding:24px 34px;display:grid;grid-template-columns:auto 1fr;gap:6px 28px;align-items:center}
.side .who{grid-column:1/-1;font-family:var(--mono);font-size:22px;letter-spacing:.16em;text-transform:uppercase}
.side .pk{font-family:var(--disp);font-weight:900;font-size:150px;line-height:.85}
.side .pl{font-size:30px;font-weight:600;line-height:1.2}
.side.h{background:var(--ember-soft);box-shadow:inset 0 0 0 2px var(--ember)} .side.h .who,.side.h .pk{color:var(--ember)}
.side.a{background:var(--ice-soft);box-shadow:inset 0 0 0 2px var(--ice)} .side.a .who,.side.a .pk{color:var(--ice)}
.side.x{background:linear-gradient(135deg,var(--ember-soft),var(--ice-soft));box-shadow:inset 0 0 0 2px #fff}
.side.x .pk{background:linear-gradient(90deg,var(--ember),#fff,var(--ice));-webkit-background-clip:text;background-clip:text;color:transparent}
.faceoff .vs{align-self:center;font-style:italic;font-size:56px;color:var(--muted)}
.jq{text-align:center;font-size:30px;color:var(--muted);margin-bottom:26px}
.jq b{color:var(--text);font-weight:500}
.jrow{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.jcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 24px 26px;display:grid;gap:16px;text-align:center}
.jcard .jn{font-family:var(--disp);font-weight:800;font-size:46px;line-height:1;text-transform:uppercase}
.jcard .jv{height:104px;border-radius:12px;display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:62px;letter-spacing:.02em;background:rgba(255,255,255,.05);color:var(--muted)}
.jcard .jv.H{background:var(--ember);color:#1B0A00}
.jcard .jv.AI{background:var(--ice);color:#001A1E}
.jcard .jv.HAI{background:linear-gradient(90deg,var(--ember),#fff,var(--ice));color:#0B1020;font-size:46px}
.jcard .jv.flip{animation:flip .55s both}
@keyframes flip{from{transform:rotateX(90deg)}}
.jrow.muted .jcard{opacity:.4}
.vbar{margin-top:26px;border-radius:16px;padding:22px;text-align:center;font-family:var(--disp);font-weight:900;font-size:64px;letter-spacing:.02em;text-transform:uppercase;background:var(--panel);color:var(--muted)}
.vbar.H{background:var(--ember);color:#1B0A00}
.vbar.AI{background:var(--ice);color:#001A1E}
.vbar.HAI{background:linear-gradient(90deg,var(--ember),#fff,var(--ice));color:#0B1020}
.vbar.draw{background:var(--raised);color:var(--text);box-shadow:inset 0 0 0 2px var(--line)}
.vbar:not(.pending){animation:rise .26s both}

/* ---------- debate ---------- */
.debate{height:100%;display:grid;align-content:center;gap:40px}
.debate .dq{font-weight:600;font-size:78px;line-height:1.14;max-width:1600px;text-wrap:balance}
.debate .dq.long{font-size:60px}
.debate .dq.xl{font-size:50px}
.mini{display:flex;gap:16px;flex-wrap:wrap}
.mini .chip b{font-weight:600}

/* ---------- pivot ---------- */
.pivot{height:100%;display:grid;place-items:center;text-align:center}
.pivot h1{font-family:var(--disp);font-weight:900;font-size:180px;line-height:.9;text-transform:uppercase;max-width:1650px}
.pivot em{font-style:normal;background:linear-gradient(90deg,var(--ember),#fff,var(--ice));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- finale: the scoreboard itself becomes AI + HUMAN, then HUMAN + AI ---------- */
.finale{position:relative;height:100%}
.fin-boxes{position:absolute;inset:60px 0 70px;display:grid;grid-template-columns:1fr 1fr;border-radius:26px;overflow:hidden;transition:opacity .26s}
.fin-boxes .h{background:var(--ember-soft);box-shadow:inset 0 0 0 3px var(--ember)}
.fin-boxes .a{background:var(--ice-soft);box-shadow:inset 0 0 0 3px var(--ice)}
.fin-tag,.fin-note{position:absolute;left:0;right:0;text-align:center;transition:opacity .26s}
.fin-tag{top:0}
.fin-note{bottom:0;font-family:var(--mono);font-size:24px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fin-words{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;justify-items:center;align-content:start;padding-top:200px}
.fw{font-family:var(--disp);font-weight:900;font-size:120px;line-height:1;text-transform:uppercase;transform-origin:0 0;white-space:nowrap}
.fw.h{color:var(--ember)} .fw.a{color:var(--ice)}
.fw.plus{display:none;background:linear-gradient(180deg,var(--ember),#fff,var(--ice));-webkit-background-clip:text;background-clip:text;color:transparent}
.fin-nums{position:absolute;left:0;right:0;top:330px;display:grid;grid-template-columns:1fr 1fr;justify-items:center;transition:opacity .26s,transform .26s}
.fin-nums span{font-family:var(--disp);font-weight:900;font-size:440px;line-height:.82;font-variant-numeric:tabular-nums}
.fin-nums .h{color:var(--ember)} .fin-nums .a{color:var(--ice)}
.fin-line{position:absolute;left:0;right:0;bottom:190px;margin:0 auto;max-width:1400px;text-align:center;font-size:48px;font-weight:500;line-height:1.3;text-wrap:balance;opacity:0;transition:opacity .26s}

.finale:not([data-step="0"]) .fw .s{display:none}

.finale[data-step="1"] .fw.a{order:1} .finale[data-step="1"] .fw.plus{order:2} .finale[data-step="1"] .fw.h{order:3}
.finale[data-step="2"] .fw.h{order:1} .finale[data-step="2"] .fw.plus{order:2} .finale[data-step="2"] .fw.a{order:3}

/* ---------- video and music ---------- */

:root:fullscreen #opBtn{display:none}

/* ---------- Q&A + thanks ---------- */
.qa,.thanks{height:100%;display:grid;align-content:center;gap:36px}

.fp{display:grid;grid-template-columns:auto 1fr;gap:10px 40px;align-items:center;padding:30px 38px;border-radius:20px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);max-width:1300px}

/* ---------- blackout + hint ---------- */

/* ---------- preview tour (?tour): a caption bar under the stage ---------- */
#tour{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;gap:24px;padding:14px 24px;font-size:16px;line-height:1.45}

#tour .tr-txt{flex:1;min-width:0;max-width:980px}
#tour .tr-step{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- operator ---------- */
#opBtn{position:fixed;right:16px;bottom:16px;z-index:6;font:600 13px/1 var(--sans);color:var(--text);background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:11px 16px;cursor:pointer;opacity:.35;transition:opacity .2s}

/* FLIP: measure the words, change the step, then animate each word from its old box to its new one. */
function finaleTo(f, step){
  const els = [...f.querySelectorAll("[data-flip]")];
  els.forEach(e => e.getAnimations().forEach(a => a.cancel()));
  const before = els.map(e => e.offsetParent ? {x:e.offsetLeft, y:e.offsetTop, w:e.offsetWidth} : null);
  f.dataset.step = step;
  if (motionReduced()) return;
  els.forEach((e, i) => {
    const b = before[i];
    if (!b || !e.offsetParent || !e.offsetWidth) return;
    const dx = b.x - e.offsetLeft, dy = b.y - e.offsetTop, k = b.w / e.offsetWidth;
    e.animate([
      {transform:`translate(${dx}px,${dy}px) scale(${k})`},
      {transform:"none"}], {duration:280, easing:"cubic-bezier(.2,.8,.2,1)"});
  });
}

function aiPrompt(s){

  const facts = s.facts.map(f => `${f[0]}: ${f[1]}`).join("; ");
  return `You are the AI contestant in a live cybersecurity decision game. Read the incident and choose exactly one option. Use only the facts given and commit to one answer.

INCIDENT: ${s.title}
${brief}
Status: ${facts}${s.clock ? `; Time remaining: ${s.clock} minutes` : ""}

QUESTION: ${s.q}
${s.opts.map((o, i) => `${K[i]}. ${o[1]}`).join("\n")}

Reply in exactly this format:
DECISION: A, B, C or D
CONFIDENCE: 0-100%
REASONING: at most 60 words
BIGGEST RISK IF WRONG: at most 35 words`;
}
const tidy = t => String(t || "").replace(/\*\*/g, "").replace(/\s+/g, " ").trim();
function parseAI(txt){
  const g = re => (String(txt).match(re) || [])[1];
  const d = (g(/DECISION\W*(?:option\s*)?([ABCD])\b/i) || "").toUpperCase();
  const c = parseInt(g(/CONFIDENCE\W*(\d{1,3})/i), 10);
  const why = tidy(g(/REASONING\W*([\s\S]*?)(?=\n[\s*#]*BIGGEST RISK|$)/i));
  const risk = tidy(g(/BIGGEST RISK(?: IF WRONG)?\W*([\s\S]*)$/i));
  if (!d || !(c >= 0 && c <= 100) || !why) return null;
  return {d, c, why, risk};
}

function rememberFocus(root){

  if (el.id) return {id:el.id};
  if (el.tagName === "SUMMARY") return {summary:[...root.querySelectorAll("summary")].indexOf(el)};
  return Object.keys(el.dataset).length ? {tag:el.tagName, data:{...el.dataset}} : null;

  if (d > 0 && c.t === "judges") {
    const r = state.rounds[c.sid], res = result(c.sid, true);
    if (hidden(r) && res.state === "done" && res.why !== "same") { r.revealed = true; state.guard = null; commit(); return; }
  }
  if (d > 0 && state.guard !== key && missing(c)) { state.guard = key; commit(); return; }
  setCue(state.cue + d, d > 0 && c.t === "preshow");
}
function setOverride(k){
  const c = cues[state.cue];
  if (c.t !== "humans") return;
  const r = state.rounds[c.sid], f = c.p === 2 ? "ov2" : "ov";
  r[f] = r[f] === k ? null : k;
  commit();
}
function cycleJudge(i){
  const c = cues[state.cue];
  if (c.t !== "judges" || i >= 4) return;
  const order = isComb(c.sid) ? [null,"H","AI","HAI"] : [null,"H","AI"];
  const r = state.rounds[c.sid];
  r.judges[i] = order[(order.indexOf(r.judges[i]) + 1) % order.length];
  commit();
}
function toggleOp(force){
  if (isControl()) return;
  const open = force ?? !document.body.classList.contains("op-open");
  document.body.classList.toggle("op-open", open);
  if (open) { const g = op.querySelector("[data-act=go]"); g && g.focus({preventScroll:true}); }
  else if (document.activeElement && op.contains(document.activeElement)) document.activeElement.blur();
  fit();
}
function fullscreen(){
  const el = document.documentElement;
  /* Keyboard lock keeps a stray Esc from dropping full screen. Holding Esc still exits. */
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen().then(() => navigator.keyboard && navigator.keyboard.lock && navigator.keyboard.lock(["Escape"])).catch(() => {});
  } catch (e) {}
}
const baseURL = () => location.href.split("#")[0];
/* Back to the top of the show with every rehearsal trace gone. Names, PIN, media and pasted
   AI answers stay: those are set-up, not rehearsal. */
function resetForDoors(){
  Object.assign(state, {cue:0, black:false, align:false, guard:null, timer:null, demo:false, rounds:freshRounds(), clock:{show:null, round:null}, mediaCmd:{t:0, paused:false}});
  commit();
}
const showLive = () => !!state.clock.show && !state.demo;
function fillDemo(){
  Object.entries(DEMO).forEach(([id, x]) => { const r = state.rounds[id]; r.votes = {...x.v}; r.votes2 = {...(!octoberPlan() && x.v2 || {A:0,B:0,C:0,D:0})}; r.ov = r.ov2 = null; r.judges = x.j.map(v => octoberPlan() && v === "HAI" ? "H" : v); r.revealed = false; });
  if (state.config.useChrisAI) state.rounds[1].votes = {A:12,B:71,C:38,D:29};
  state.demo = true;
}
const cleanSlate = () => state.cue === 0 && !state.clock.show && SCEN.every(s => { const r = state.rounds[s.id]; return !sum(r.votes) && !sum(r.votes2) && !r.ov && !r.ov2 && !r.judges.some(Boolean); });
let resetArmed = null, aiDraft = "", aiMsg = "", planMsg = "";
function applyChrisAI(){
  if (!cleanSlate()) { planMsg = "Export saved results, then Reset for doors before changing prepared AI responses. No votes, clock or media were changed."; renderOp(); return false; }
  state.config.useChrisAI = true;
  planMsg = "Chris’s final prepared responses selected. Custom pasted replies and uploaded media are preserved.";
  commit(); return true;
}
function applyOctoberPlan(){
  if (!cleanSlate()) { planMsg = "Export the saved results, then Reset for doors before applying the October 14 plan. No votes, clock, settings or media were changed."; renderOp(); return false; }
  keepCue(() => {
    const d = defaults().config;
    if (state.config.pollingProvider !== d.pollingProvider) {
      state.config.previousPolling = {provider:pollingProvider(), pin:state.config.pin, joinURL:state.config.pollingJoinURL || ""};
      Object.assign(state.config, {pollingProvider:d.pollingProvider, pin:d.pin, pollingJoinURL:d.pollingJoinURL});
    }
    Object.assign(state.config, {showPlan:d.showPlan, showTiming:d.showTiming, lineup:d.lineup, pivotAfter:0, combined:[], host:d.host, judges:d.judges, sponsors:d.sponsors, useChrisAI:d.useChrisAI});
  });
  planMsg = "October 14 v3 applied: Slido, five scored rounds and the round-six collaboration closing. 85-minute show plus 20-minute Q&A. Previous provider details, uploaded media and custom AI replies are preserved.";
  commit();
  return true;
}
const parseIds = str => [...new Set(String(str).split(/[^0-9]+/).map(Number).filter(n => S(n)))];

op.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const d = b.dataset;
  switch (d.act) {
    case "applyplan": applyOctoberPlan(); break;
    case "applyai": applyChrisAI(); break;
    case "go": nav(1); break;
    case "back": nav(-1); break;
    case "jump": setCue(+d.i); break;
    case "black": state.black = !state.black; commit(); break;
    case "full": fullscreen(); break;
    case "close": toggleOp(false); break;
    case "opencontrol": window.open(baseURL() + "#control", "aivh-control", "popup,width=1440,height=900"); toggleOp(false); break;
    case "openstage": window.open(baseURL(), "aivh-stage", "popup,width=1280,height=720"); break;
    case "timer": state.timer = {endsAt: Date.now() + state.config.secs * 1000, total: state.config.secs}; commit(); break;
    case "timerstop": state.timer = state.timer ? {...state.timer, endsAt: Date.now()} : null; commit(); break;
    case "music": state.music = !state.music; commit(); break;
    case "vpause": controlMedia("toggle"); break;
    case "vrestart": controlMedia("restart"); break;
    case "vretry": controlMedia("retry"); break;
    case "vcc": state.captions = !state.captions; commit(); break;
    case "vskip": go(1, true); break;
    case "projectorclaim": claimProjector(); break;
    case "opview":
      opView = d.view;
      try { sessionStorage.setItem(`${KEY}:operator-view`, opView); } catch (e) {}
      renderOp(); break;
    case "mrelease": loadReleasedFilm(d.slot); break;
    case "mreleaseall": loadAllReleasedFilms(); break;
    case "mcancel": if (bulkProgress) bulkProgress.cancelled = true; downloadAbort?.abort(); break;
    case "ackpreflight": state.readinessAck = readinessKey(); busy = "Agreed fallbacks acknowledged for this exact setup."; commit(); break;
    case "mrestore": restoreMedia(d.slot); break;
    case "mdel": dropMedia(d.slot); break;
    case "aiuse": {
      const a = parseAI(aiDraft);
      if (!a) { aiMsg = "Couldn't find DECISION (A to D), CONFIDENCE and REASONING in that reply. Check the format and try again."; renderOp(); break; }
      state.config.ai[d.sid] = a; aiDraft = ""; aiMsg = `Using the pasted answer: ${a.d} at ${a.c}%.`; commit(); break;
    }
    case "aireset": delete state.config.ai[d.sid]; aiMsg = "Back to the prepared answer."; commit(); break;
    case "ov": { const r = state.rounds[d.sid], f = d.p === "2" ? "ov2" : "ov"; r[f] = r[f] === d.k ? null : d.k; commit(); break; }
    case "clearvotes": { const r = state.rounds[d.sid]; if (d.p === "2") { r.votes2 = {A:0,B:0,C:0,D:0}; r.ov2 = null; } else { r.votes = {A:0,B:0,C:0,D:0}; r.ov = null; } commit(); break; }
    case "jv": state.rounds[d.sid].judges[+d.i] = d.v || null; commit(); break;
    case "reveal": state.rounds[d.sid].revealed = true; state.guard = null; commit(); break;
    case "unreveal": state.rounds[d.sid].revealed = false; commit(); break;
    case "align": state.align = !state.align; commit(); break;
    case "demo": fillDemo(); commit(); break;
    case "reset":
      /* Two separate taps, not a double-click, and a real show in progress asks once more. */
      if (!resetArmed) { resetArmed = {at:Date.now(), t:setTimeout(() => { resetArmed = null; renderOp(); }, 3500)}; renderOp(); break; }
      if (Date.now() - resetArmed.at < 600) break;
      clearTimeout(resetArmed.t); resetArmed = null;
      if (showLive() && !confirm("The show is running. Wipe every vote and go back to the pre-show?")) { renderOp(); break; }
      resetForDoors(); break;
    case "copy": {
      const ta = document.getElementById(d.t), label = b.textContent;
      const done = ok => { b.textContent = ok ? "Copied" : "Selected. Press Cmd+C or Ctrl+C"; setTimeout(() => { b.textContent = label; }, 2200); };
      try { navigator.clipboard.writeText(ta.value).then(() => done(true), () => { ta.focus(); ta.select(); done(false); }); }
      catch (err) { ta.focus(); ta.select(); done(false); }
      break;
    }
  }
});
op.addEventListener("keydown", e => {
  if (!e.target.closest("[data-act=opview]") || !["ArrowLeft","ArrowRight","Home","End"].includes(e.key)) return;
  e.preventDefault(); e.stopPropagation();
  const views = ["live","setup","results"], current = views.indexOf(opView);
  opView = e.key === "Home" ? views[0] : e.key === "End" ? views[2] : views[(current + (e.key === "ArrowRight" ? 1 : 2)) % 3];
  try { sessionStorage.setItem(`${KEY}:operator-view`, opView); } catch (error) {}
  renderOp(); op.querySelector("[role=tab][aria-selected=true]")?.focus();
});
op.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "ai-paste") { aiDraft = t.value; return; }
  if (!t.dataset.vote) return;
  const r = state.rounds[t.dataset.sid], v = t.dataset.p === "2" ? r.votes2 : r.votes;
  v[t.dataset.vote] = Math.max(0, parseInt(t.value, 10) || 0);
});
op.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.media) { const f = t.files && t.files[0]; if (f) saveMedia(t.dataset.media, f); return; }
  if (t.dataset.vote) { commit(); return; }
  const k = t.dataset.cfg;
  if (!k) return;
  const cfg = state.config;
  if (k === "pollingJoinURL" && t.value && !validPollingJoinURL(t.value)) { planMsg = "Use an HTTPS participant link on qr.sli.do, app.sli.do or slido.com. The previous link is retained."; renderOp(); return; }
  keepCue(() => {
    if (k === "judge") cfg.judges[+t.dataset.i] = t.value.trim() || `Judge ${+t.dataset.i + 1}`;
    else if (k === "lineup") { const ids = parseIds(t.value); if (ids.length) cfg.lineup = ids; }
    else if (k === "combined") cfg.combined = parseIds(t.value);
    else if (k === "pivotAfter") cfg.pivotAfter = Math.max(0, parseInt(t.value, 10) || 0);
    else if (k === "secs") cfg.secs = Math.max(5, parseInt(t.value, 10) || 45);
    else if (k === "bcai" || k === "judgeReveal" || k === "calmMotion") cfg[k] = t.checked;
    else if (k === "safe") cfg.safe = Math.min(15, Math.max(0, parseInt(t.value, 10) || 0));
    else if (k === "pin") { if (pollingProvider() === "slido" && t.value.replace(/\s/g, "") !== cfg.pin.replace(/\s/g, "")) cfg.pollingJoinURL = ""; cfg.pin = t.value; }
    else cfg[k] = t.value;
  });
  commit();
});
$("#opBtn").addEventListener("click", () => toggleOp(true));
$("#tour").addEventListener("click", e => {
  if (e.target.closest("[data-tour-controls]")) { toggleOp(true); return; }
  if (e.target.closest("[data-tour-info]")) { tourHelp = !tourHelp; renderTour(cues[state.cue]); fit(); return; }
  const b = e.target.closest("[data-tour]");
  if (!b) return;
  if (b.dataset.tour === "1" && state.cue === cues.length - 1) {
    if (Date.now() - lastNav < 300) return;
    lastNav = Date.now();
    resetForDoors(); fillDemo(); commit();
  }
  else nav(+b.dataset.tour);
});

addEventListener("pointerdown", unblock);
/* Presentation clickers send Page Down / Page Up, "." or "b" for a blank screen, and F5 or Esc
   for "start slideshow". A held key or a clicker's double send must not skip a screen. */
let lastNav = 0;
function nav(d){
  if (Date.now() - lastNav < 300) return;
  lastNav = Date.now();
  go(d);
}
addEventListener("keydown", e => {
  unblock();
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key, tgt = e.target, field = tgt.closest && tgt.closest("input, textarea, select, [contenteditable=\"true\"]");
  const control = tgt.closest && tgt.closest("button, summary, a[href], [role=button]");
  const page = k === "PageDown" || k === "PageUp";
  if (k === "F5") { e.preventDefault(); return; }
  if (field && !page) { if (k === "Enter" && tgt.tagName === "INPUT") tgt.blur(); return; }
  if (control && (k === " " || k === "Enter")) { if (e.repeat) e.preventDefault(); return; }
  if (page || k === " " || k === "ArrowRight" || k === "ArrowLeft") {
    e.preventDefault();
    if (page) { const a = document.activeElement; if (a && a !== document.body && a.blur) a.blur(); }
    if (!e.repeat) nav(k === "PageUp" || k === "ArrowLeft" ? -1 : 1);
    return;
  }
  if (e.repeat) return;
  if (k === "." || k === "b") { state.black = !state.black; commit(); }
  else if (e.shiftKey && /^[ABCD]$/.test(k)) setOverride(k);
  else if (k === "o" || k === "O") { if (isControl() || !ctlSeen() || !projectorOwned) toggleOp(); }
  else if ((k === "f" || k === "F") && !isControl()) fullscreen();
  else if (k === "t" || k === "T") { if (cues[state.cue].t === "poll") { state.timer = {endsAt: Date.now() + state.config.secs * 1000, total: state.config.secs}; commit(); } }
  else if (/^[1-4]$/.test(k)) cycleJudge(+k - 1);
  else if (k === "Escape" && document.body.classList.contains("op-open")) toggleOp(false);
});

/* ---------- fit the 1920×1080 stage to any window ---------- */
const vp = $("#vp");
let compactStage = false;
function fit(){
  const compact = innerWidth <= 900 && !isControl();
  if (compact !== compactStage) { scene.querySelectorAll(".answer-detail").forEach(el => { el.open = !compact; }); compactStage = compact; }
  if (innerWidth <= 900 && !isControl()) { stage.style.transform = "none"; return; }
  const w = vp.clientWidth, h = vp.clientHeight, s = Math.min(w / 1920, h / 1080) * (isControl() ? 1 : 1 - (state.config.safe || 0) / 100);
  stage.style.transform = `translate(${((w - 1920 * s) / 2).toFixed(1)}px, ${((h - 1080 * s) / 2).toFixed(1)}px) scale(${s})`;
}
try {
  new ResizeObserver(fit).observe(vp);
  if (TOUR) new ResizeObserver(() => document.documentElement.style.setProperty("--tourh", $("#tour").offsetHeight + "px")).observe($("#tour"));
} catch (e) { addEventListener("resize", fit); }

if (location.hash.replace("#", "") === "control") document.body.classList.add("control");
if (TOUR) { document.body.classList.add("tour"); document.title = "AI vs. Human preview"; if (firstVisit) fillDemo(); }
acquireProjector();
render(); fit(); checkMedia();
releaseCatalogue().catch(() => {});
if (FULL_FILMS_PREVIEW) releaseCatalogue().then(loadAllReleasedFilms).catch(error => { busy = error.message; renderOp(); });
if ((FILM_PREVIEW || INTRO_PREVIEW) && firstVisit) {
  const slot = INTRO_PREVIEW ? "opener" : `vig${FILM_ID}`;
  loadReleasedFilm(slot).then(ok => {
    if (ok) { setCue(cues.findIndex(c => c.t === "video" && c.slot === slot)); commit(); }
  });
}
if ("serviceWorker" in navigator && (location.protocol === "https:" || ["127.0.0.1","localhost"].includes(location.hostname))) navigator.serviceWorker.register("sw.js").catch(() => {});
const hint = $("#hint");
if (!firstVisit || isControl()) hint.classList.add("gone");
setTimeout(() => hint.classList.add("gone"), 9000);
if (firstVisit && !TOUR) { const d = $("#d-set"); if (d) d.open = true; if (!isControl()) toggleOp(true); }
})();
</script>
